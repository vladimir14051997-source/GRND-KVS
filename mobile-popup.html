<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>GRND.GG | Жалобы</title>
<link rel="stylesheet" type="text/css" href="styles.css">
<link rel="stylesheet" type="text/css" href="mobile-styles.css">
<style>
/* Дополнительные мобильные стили для попапа */
@media (max-width: 768px) {
    .container {
        width: 100%;
        height: auto;
        min-height: 100vh;
        padding: 16px;
    }
    
    .template {
        flex-wrap: wrap;
        gap: 8px;
    }
    
    .template-name,
    .template-description,
    .template-text {
        width: 100%;
        text-align: left;
        white-space: normal;
        word-break: break-word;
    }
    
    .delete-button {
        width: 100%;
        margin-top: 8px;
    }
    
    .tabs {
        flex-wrap: wrap;
    }
    
    .tab-button {
        flex: 1;
        font-size: 12px;
        padding: 10px 8px;
    }
    
    .modal-content {
        width: 95%;
        margin: 10% auto;
        padding: 16px;
    }
    
    textarea {
        font-size: 16px;
    }
    
    .settings-section {
        padding: 12px;
    }
    
    .setting-item input[type="text"],
    .setting-item input[type="number"] {
        font-size: 16px;
        padding: 12px;
    }
}
</style>
</head>
